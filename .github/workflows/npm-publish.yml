name: Publish to npm
on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24's bundled npm may be older
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public
        env:
          # Only needed until a Trusted Publisher is configured on npmjs.com; remove afterwards
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
