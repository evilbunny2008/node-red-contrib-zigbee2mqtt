<script type="text/x-red" data-help-name="zigbee2mqtt-eb-bridge">
    <p>监听所有 <code>zigbee2mqtt/bridge/#</code> 消息。</p>
    <h3>配置</h3>
    <dl class="message-properties">
        <dt class="optional">名称 <span class="property-type">字符串</span></dt><dd>为节点设置任意名称。</dd>
        <dt>服务器 <span class="property-type">对象</span></dt><dd>选择要使用的 Zigbee2MQTT 服务器实例。</dd>
    </dl>

    <h3>输入</h3>
    <h5>输入</h5>
    <dl class="message-properties">
        <dt>payload <span class="property-type">字符串</span></dt><dd>MQTT 消息</dd>
        <dt>topic<span class="property-type">字符串</span></dt><dd>MQTT 主题</dd>
    </dl>

    <h3>输出</h3>
    <h5>输出</h5>
    <dl class="message-properties">
        <dt>payload <span class="property-type">字符串</span></dt><dd>MQTT 消息</dd>
        <dt>topic<span class="property-type">字符串</span></dt><dd>MQTT 主题</dd>
    </dl>
</script>
