<script type="text/x-red" data-help-name="zigbee2mqtt-eb-get">
    <p>Obtiene el último valor del dispositivo.</p>
    <h3>Configuración</h3>
    <dl class="message-properties">
        <dt class="optional">Nombre <span class="property-type">cadena</span></dt><dd>Elige cualquier nombre para identificar el nodo.</dd>
        <dt>Servidor <span class="property-type">objeto</span></dt><dd>Elige la instancia del servidor Zigbee2MQTT que se utilizará.</dd>
        <dt>Dispositivo <span class="property-type">cadena</span></dt><dd>Selecciona el dispositivo que quieres consultar.</dd>
    </dl>

    <h3>Salidas</h3>
    <h5>Salida</h5>
    <dl class="message-properties">
        <dt>payload <span class="property-type">cadena</span></dt><dd>valor actual</dd>
        <dt>payload_in<span class="property-type">objeto</span></dt><dd>payload de entrada</dd>
        <dt>payload_raw<span class="property-type">objeto</span></dt><dd>payload completo</dd>
        <dt>device<span class="property-type">objeto</span></dt><dd>información del dispositivo</dd>
    </dl>
</script>
