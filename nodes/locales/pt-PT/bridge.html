<script type="text/x-red" data-help-name="zigbee2mqtt-eb-bridge">
    <p>Escuta todas as mensagens de <code>zigbee2mqtt/bridge/#</code>.</p>
    <h3>Configuração</h3>
    <dl class="message-properties">
        <dt class="optional">Nome <span class="property-type">string</span></dt><dd>Escolha um nome qualquer para identificar o seu nó.</dd>
        <dt>Servidor <span class="property-type">objeto</span></dt><dd>Escolha a instância do servidor zigbee2mqtt a utilizar.</dd>
    </dl>

    <h3>Entradas</h3>
    <h5>Entrada</h5>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt><dd>mensagem MQTT</dd>
        <dt>topic<span class="property-type">string</span></dt><dd>tópico MQTT</dd>
    </dl>

    <h3>Saídas</h3>
    <h5>Saída</h5>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt><dd>mensagem MQTT</dd>
        <dt>topic<span class="property-type">string</span></dt><dd>tópico MQTT</dd>
    </dl>
</script>
