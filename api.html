<script type='text/javascript'>
    // This node has no editable properties and is never shown in the palette;
    // it exists only so the runtime side (api.js) can register its httpAdmin
    // routes as a normal, parseable node module.
    RED.nodes.registerType('zigbee2mqtt-eb-api', {
        category: 'config',
        defaults: {},
        label: function () { return 'zigbee2mqtt-eb-api'; }
    });

    (function() {
        if (typeof Z2MDebug === 'undefined') return;
        var debug = Z2MDebug.create('api.html');
        
        debug.log('');
        debug.log('╔═══════════════════════════════════════════════════════════╗');
        debug.log('║ 🔍 [api.html] SCRIPT LOADING CHECK                       ║');
        debug.log('╚═══════════════════════════════════════════════════════════╝');
        
        const checks = {
            'Z2MDebug': typeof Z2MDebug !== 'undefined',
            'Z2MConfig': typeof Z2MConfig !== 'undefined',
            'Zigbee2MqttEditor': typeof Zigbee2MqttEditor !== 'undefined'
        };
        
        let allOk = true;
        for (let [name, status] of Object.entries(checks)) {
            const icon = status ? '✅' : '❌';
            debug.log(`  ${icon} ${name}: ${status ? 'LOADED' : 'MISSING'}`);
            if (!status) allOk = false;
        }
        
        if (allOk) {
            debug.log('');
            debug.log('✅ All scripts loaded successfully!');
        } else {
            debug.error('');
            debug.error('❌ Some scripts FAILED to load!');
            debug.error('   Check if files exist in resources/@evilbunny/node-red-contrib-zigbee2mqtt/js/');
        }
        
        debug.log('╚═══════════════════════════════════════════════════════════╝');
        debug.log('');
    })();
</script>
